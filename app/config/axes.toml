# 各軸設定：軟體極限、步進距離與預設速度

# 第 1 軸（X），數值單位為 mm
[[axes]]
# 軸號，1 ~ 7
number = 1
# 畫面顯示名稱
name = "X"
# 軟體極限最小值（mm）。暫定值，待依機構行程確認
soft_limit_min = -100.0
# 軟體極限最大值（mm）。暫定值，待依機構行程確認
soft_limit_max = 100.0
# 步進距離：長步（mm）。暫定值，待依機構行程確認
step_long = 10.0
# 步進距離：中步（mm）。暫定值，待依機構行程確認
step_medium = 1.0
# 步進距離：短步（mm）。暫定值，待依機構行程確認
step_short = 0.1
# 預設速度，1 ~ 100（%）
default_speed = 50

