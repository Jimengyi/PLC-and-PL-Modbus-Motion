[project]
name = "plc-motion"
version = "0.1.0"
description = "PLC 七軸運動 Modbus TCP Master（PySide6）"
readme = "README.md"
authors = [
    { name = "Zeng Yi Peng", email = "jim.zengyi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pymodbus>=3.16.1",
    "pyside6>=6.12.0",
]

[project.scripts]
plc-motion = "plc_motion:main"
plc-sim = "plc_motion.sim.main:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
